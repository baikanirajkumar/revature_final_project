version: 2

models:
  - name: stg_countries
    description: "Cleaned country master data"

    columns:
      - name: COUNTRY_ID
        tests:
          - not_null
          - unique

      - name: COUNTRY_NAME
        tests:
          - not_null

      - name: ISO3
        tests:
          - not_null
          - unique

  - name: stg_indicators
    description: "Cleaned GDP indicator data"

    columns:
      - name: INDICATOR_ID
        tests:
          - not_null
          - unique

  - name: stg_fx_rates
    description: "Cleaned foreign exchange rate data"

    columns:
      - name: FX_ID
        tests:
          - not_null
          - unique

  - name: stg_observations
    description: "Cleaned GDP observation data"

    columns:
      - name: OBS_ID
        tests:
          - not_null
          - unique

      - name: COUNTRY_ID
        tests:
          - not_null

      - name: INDICATOR_ID
        tests:
          - not_null